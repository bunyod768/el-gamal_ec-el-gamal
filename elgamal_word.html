<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Gamal -- So'z Shifrlash</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080b14;
  --surface: #0d1120;
  --card:    #111827;
  --border:  #1e2a42;
  --accent:  #38bdf8;
  --gold:    #fbbf24;
  --green:   #34d399;
  --red:     #f87171;
  --purple:  #a78bfa;
  --muted:   #4b6080;
  --text:    #e2e8f0;
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
  --body: 'DM Sans', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body { background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; padding-bottom:80px; }
.wrap{max-width:960px;margin:0 auto;padding:40px 20px;}
.hero{text-align:center;margin-bottom:30px;}
.hero h1{font-family:var(--display);font-size:4rem;letter-spacing:4px;color:var(--accent);}

.key-panel, .input-row, .section-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:20px;}
.panel-title{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:15px;display:flex;align-items:center;gap:10px;}

.key-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;}
.kfield label{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:5px;}
.kfield input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:var(--mono);}

.btn{padding:12px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:0.2s;}
.btn-enc{background:var(--accent);color:var(--bg);}
.btn-demo{border:1px solid var(--gold);color:var(--gold);background:transparent;}

.enc-grid, .dec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;}
.enc-card, .dec-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;padding:15px;}
.ec-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.ev{color:var(--gold);font-weight:bold;}
.ek{color:var(--purple);font-weight:bold;}

.alert{padding:12px;border-radius:8px;font-family:var(--mono);font-size:12px;margin-bottom:15px;display:none;}
.alert-err{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid var(--red);}
.alert-ok{background:rgba(52,211,153,0.1);color:var(--green);border:1px solid var(--green);}
.show{display:block;}
.final-box{text-align:center;padding:30px;background:rgba(52,211,153,0.05);border:1px solid var(--green);border-radius:15px;margin-top:20px;}
.final-word{font-family:var(--display);font-size:4rem;color:var(--green);letter-spacing:10px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero"><h1>El Gamal</h1></div>

  <div class="key-panel">
    <div class="panel-title">Parametrlar</div>
    <div class="key-grid">
      <div class="kfield"><label>p (Tub son)</label><input type="number" id="kp" value="257"></div>
      <div class="kfield"><label>g (Primitiv ildiz)</label><input type="number" id="kg" value="3"></div>
      <div class="kfield"><label>x (Maxfiy kalit)</label><input type="number" id="kx" value="79"></div>
      <div class="kfield" style="display:flex;align-items:flex-end">
        <button class="btn btn-demo" style="width:100%" onclick="computeY()">y Hisoblash</button>
      </div>
    </div>
    <div id="key-vals-row" style="margin-top:15px; display:none; font-family:var(--mono); font-size:13px; color:var(--accent);">
      Natija: y = <span id="disp-y" style="color:var(--gold)"></span> (g^x mod p)
    </div>
  </div>

  <div class="input-row" style="display:flex; gap:15px; align-items:flex-end;">
    <div style="flex:1;">
      <label style="display:block; font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:5px;">Shifrlash uchun matn</label>
      <input type="text" id="word-input" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:12px; color:white; font-family:var(--mono);" placeholder="SALOM">
    </div>
    <button class="btn btn-enc" onclick="doEncrypt()">Shifrlash & Deshifrlash</button>
    <button class="btn btn-demo" onclick="loadDemo()">Demo</button>
  </div>

  <div id="main-alert" class="alert"></div>

  <div id="results" style="display:none;">
    <div class="section-panel"><div class="panel-title">Shifrlash bosqichi (k ko'rsatilgan)</div><div class="enc-grid" id="enc-grid"></div></div>
    <div class="section-panel"><div class="panel-title">Deshifrlash bosqichi</div><div class="dec-grid" id="dec-grid"></div></div>
    <div class="final-box"><div style="color:var(--muted); font-size:12px; margin-bottom:10px;">YAKUNIY NATIJA</div><div class="final-word" id="final-word"></div></div>
  </div>
</div>

<script>
// Matematik funksiyalar
function modPow(b,e,m){
  let r=1n; b=b%m;
  while(e>0n){if(e%2n===1n)r=(r*b)%m; e=e/2n; b=(b*b)%m;}
  return r;
}
function modInv(a,m){
  let [or,r,os,s]=[a,m,1n,0n];
  while(r!==0n){let q=or/r; [or,r]=[r,or-q*r]; [os,s]=[s,os-q*s];}
  return or===1n?((os%m)+m)%m:null;
}
function isPrime(n){
  if(n<2n)return false; if(n<4n)return true;
  if(n%2n===0n||n%3n===0n)return false;
  for(let i=5n;i*i<=n;i+=6n)if(n%i===0n||n%(i+2n)===0n)return false;
  return true;
}
function getPrimeFactors(n){
  const factors=new Set(); let d=2n; let temp=n;
  while(d*d<=temp){while(temp%d===0n){factors.add(d); temp/=d;} d++;}
  if(temp>1n)factors.add(temp); return factors;
}
function isPrimitiveRoot(g,p){
  if(g<2n||g>=p)return false;
  let phi=p-1n; let factors=getPrimeFactors(phi);
  for(let q of factors) if(modPow(g,phi/q,p)===1n)return false;
  return true;
}

function alert2(msg,type){
  const el=document.getElementById('main-alert');
  el.textContent=msg; el.className='alert alert-'+type+' show';
}

function computeY(){
  const p=BigInt(document.getElementById('kp').value || 0);
  const g=BigInt(document.getElementById('kg').value || 0);
  const x=BigInt(document.getElementById('kx').value || 0);
  
  if(!isPrime(p)){ alert2('Xato: p tub son bo\'lishi kerak!','err'); return null; }
  if(!isPrimitiveRoot(g,p)){ alert2('Xato: g soni p uchun primitiv ildiz emas!','err'); return null; }
  if(x<2n || x>=p-1n){ alert2('Xato: x diapazoni 2 <= x < p-1 bo\'lishi kerak!','err'); return null; }
  
  const y=modPow(g,x,p);
  document.getElementById('disp-y').textContent=y;
  document.getElementById('key-vals-row').style.display='block';
  alert2('y muvaffaqiyatli hisoblandi.','ok');
  return y;
}

let encData=[];

function doEncrypt(){
  const p=BigInt(document.getElementById('kp').value);
  const g=BigInt(document.getElementById('kg').value);
  const x=BigInt(document.getElementById('kx').value);
  const word=document.getElementById('word-input').value.trim();
  
  const y = computeY(); // Parametrlarni olib y ni qaytadan hisoblaydi va tekshiradi
  if(y === null || !word) { if(!word) alert2('Matn kiriting!','err'); return; }

  encData=[];
  const eGrid=document.getElementById('enc-grid');
  eGrid.innerHTML='';

  for(let ch of word){
    let M=BigInt(ch.charCodeAt(0));
    // Har bir harf uchun tasodifiy k (1 < k < p-1)
    let k=BigInt(Math.floor(Math.random()*(Number(p)-3))+2);
    let c1=modPow(g,k,p);
    let c2=(M * modPow(y,k,p)) % p;
    
    encData.push({c1, c2, k_val: k});

    eGrid.innerHTML += `
      <div class="enc-card">
        <div style="font-family:var(--display); font-size:24px; color:var(--accent); margin-bottom:10px;">Harf: ${ch} (ASCII: ${M})</div>
        <div class="ec-row"><span>Tanlangan k:</span><span class="ek">${k}</span></div>
        <div class="ec-row"><span>c1 = g^k mod p:</span><span class="ev">${c1}</span></div>
        <div class="ec-row"><span>c2 = M*y^k mod p:</span><span class="ev">${c2}</span></div>
      </div>`;
  }
  
  doDecrypt(p,x);
  document.getElementById('results').style.display='block';
}

function doDecrypt(p,x){
  const dGrid=document.getElementById('dec-grid');
  dGrid.innerHTML='';
  let finalWord='';

  encData.forEach(d=>{
    let s=modPow(d.c1, x, p);
    let sInv=modInv(s, p);
    let M=(d.c2 * sInv) % p;
    let ch=String.fromCharCode(Number(M));
    finalWord += ch;

    dGrid.innerHTML += `
      <div class="dec-card">
        <div style="font-family:var(--display); font-size:24px; color:var(--green); margin-bottom:10px;">Natija: ${ch}</div>
        <div class="ec-row"><span>Berilgan c1:</span><span class="ev">${d.c1}</span></div>
        <div class="ec-row"><span>s = c1^x mod p:</span><span class="ev">${s}</span></div>
        <div class="ec-row"><span>M = c2 * s⁻¹ mod p:</span><span class="ev">${M}</span></div>
      </div>`;
  });

  document.getElementById('final-word').textContent=finalWord;
}

function loadDemo(){
  document.getElementById('kp').value='257';
  document.getElementById('kg').value='3';
  document.getElementById('kx').value='79';
  document.getElementById('word-input').value='ELGAMAL';
  computeY();
}
</script>
</body>
</html>
